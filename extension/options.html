<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Mortgage Rate Tracker - Settings</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 20px;
      max-width: 600px;
      margin: 0 auto;
      background: #f5f5f5;
    }

    .container {
      background: white;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    h1 {
      margin-top: 0;
      color: #333;
      font-size: 24px;
    }

    .setting-group {
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 500;
      color: #555;
    }

    input[type="number"],
    textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 14px;
      box-sizing: border-box;
    }

    textarea {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      resize: vertical;
      min-height: 100px;
    }

    .help-text {
      font-size: 12px;
      color: #777;
      margin-top: 5px;
    }

    .button-group {
      display: flex;
      gap: 10px;
      margin-top: 30px;
    }

    button {
      padding: 10px 20px;
      border: none;
      border-radius: 4px;
      font-size: 14px;
      cursor: pointer;
      font-weight: 500;
    }

    .save-btn {
      background: #4CAF50;
      color: white;
    }

    .save-btn:hover {
      background: #45a049;
    }

    .reset-btn {
      background: #f44336;
      color: white;
    }

    .reset-btn:hover {
      background: #da190b;
    }

    .status {
      margin-top: 15px;
      padding: 10px;
      border-radius: 4px;
      display: none;
    }

    .status.success {
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }

    .status.error {
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>⚙️ Mortgage Rate Tracker Settings</h1>

    <div class="setting-group">
      <label for="threshold">Alert Threshold (%):</label>
      <input
        type="number"
        id="threshold"
        step="0.001"
        min="0"
        max="20"
        placeholder="5.625"
      >
      <div class="help-text">
        You'll receive an email alert when the rate drops below this threshold.
      </div>
    </div>

    <div class="setting-group">
      <label for="emails">Email Recipients:</label>
      <textarea
        id="emails"
        placeholder="Enter email addresses, one per line&#10;&#10;kylebahr88@gmail.com&#10;albbt2@gmail.com"
      ></textarea>
      <div class="help-text">
        Enter one email address per line. All recipients will receive alerts.
      </div>
    </div>

    <div class="setting-group">
      <label for="checkTimes">Automatic Check Times (Central Time):</label>
      <textarea
        id="checkTimes"
        placeholder="Enter times in 24-hour format, one per line&#10;&#10;8:00&#10;10:00&#10;13:00&#10;16:00"
      ></textarea>
      <div class="help-text">
        Enter times in 24-hour format (e.g., 8:00, 13:00, 16:00). Checks only run Monday-Friday.
      </div>
    </div>

    <div class="button-group">
      <button class="save-btn" id="saveBtn">Save Settings</button>
      <button class="reset-btn" id="resetBtn">Reset to Defaults</button>
    </div>

    <div class="status" id="status"></div>
  </div>

  <script src="options.js"></script>
</body>
</html>
