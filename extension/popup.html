<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 320px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 14px;
      color: #333;
    }
    h1 {
      font-size: 16px;
      margin: 0 0 16px 0;
      color: #1a73e8;
    }
    .status-card {
      background: #f8f9fa;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .rate-display {
      font-size: 32px;
      font-weight: bold;
      color: #202124;
    }
    .rate-display.alert {
      color: #0d904f;
    }
    .label {
      font-size: 12px;
      color: #5f6368;
      margin-bottom: 4px;
    }
    .timestamp {
      font-size: 12px;
      color: #5f6368;
      margin-top: 8px;
    }
    .threshold {
      font-size: 13px;
      color: #5f6368;
      margin-top: 4px;
    }
    .btn {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
      margin-top: 8px;
    }
    .btn-primary {
      background: #1a73e8;
      color: white;
    }
    .btn-primary:hover {
      background: #1557b0;
    }
    .history {
      margin-top: 16px;
      max-height: 200px;
      overflow-y: auto;
    }
    .history-item {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid #e8eaed;
      font-size: 13px;
    }
    .history-rate {
      font-weight: 500;
    }
    .history-time {
      color: #5f6368;
    }
    .schedule {
      margin-top: 12px;
      font-size: 12px;
      color: #5f6368;
    }
    .no-data {
      color: #5f6368;
      font-style: italic;
    }
  </style>
</head>
<body>
  <h1>Mortgage Rate Tracker</h1>

  <div class="status-card">
    <div class="label">Current Rate (No Points)</div>
    <div id="currentRate" class="rate-display">--</div>
    <div class="threshold">Alert threshold: <span id="threshold">5.625</span>%</div>
    <div id="lastCheck" class="timestamp">No checks yet</div>
  </div>

  <button id="checkNow" class="btn btn-primary">Check Now</button>

  <div class="schedule">
    <strong>Schedule (CT):</strong> 8am, 10am, 1pm, 4pm
  </div>

  <div class="history">
    <div class="label">Recent History</div>
    <div id="historyList">
      <div class="no-data">No rate history yet</div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
